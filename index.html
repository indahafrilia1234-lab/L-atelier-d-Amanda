<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
    />
    <title>Linktree · L'telier d'Amanda</title>
    <!-- Font yang manis -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome 6 (gratis) untuk ikon -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      /* reset & basis */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Quicksand", sans-serif;
        background: #fce4ec;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: radial-gradient(circle at 10% 30%, #ffe4ec, #f8bbd0);
      }

      .card {
        max-width: 420px;
        width: 100%;
        background: rgba(255, 245, 247, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 48px 48px 40px 40px;
        padding: 32px 24px 40px;
        box-shadow:
          0 20px 40px rgba(255, 105, 135, 0.25),
          0 8px 20px rgba(255, 80, 120, 0.15);
        border: 1px solid rgba(255, 220, 230, 0.6);
        transition: all 0.2s ease;
        text-align: center;
      }

      /* ==================================================
         CSS AVATAR DIUBAH SEDIKIT AGAR GAMBAR BULAT & RAPI
         ================================================== */
      .avatar {
        width: 100px;
        height: 100px;
        margin: 0 auto 16px;
        background: linear-gradient(145deg, #ffb6c9, #ff8aae);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 20px #f48fb1a0;
        border: 4px solid #fff5f7;
        overflow: hidden; /* Agar gambar terpotong bulat sempurna */
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Menutupi seluruh lingkaran */
      }
      /* ================================================== */

      .title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #6b3b4a;
        margin-bottom: 6px;
        text-shadow: 0 2px 6px rgba(255, 200, 210, 0.5);
      }

      .subtitle {
        font-size: 16px;
        font-weight: 600;
        color: #9f5e72;
        background: rgba(255, 220, 230, 0.5);
        display: inline-block;
        padding: 6px 22px;
        border-radius: 40px;
        backdrop-filter: blur(4px);
        margin-bottom: 28px;
        border: 1px solid #ffcdd9;
        letter-spacing: 0.3px;
      }

      .link-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin: 20px 0 28px;
      }

      .link-item {
        display: flex;
        align-items: center;
        background: rgba(255, 245, 247, 0.75);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        border: 1px solid #ffd9e2;
        border-radius: 60px;
        padding: 14px 22px;
        text-decoration: none;
        color: #4f2d3a;
        font-weight: 600;
        font-size: 18px;
        transition: 0.2s;
        box-shadow: 0 4px 10px rgba(255, 130, 160, 0.15);
        gap: 14px;
      }

      .link-item i {
        font-size: 26px;
        width: 36px;
        text-align: center;
        color: #b34b66;
        transition: 0.2s;
      }

      .link-item span {
        flex: 1;
        text-align: left;
      }

      .link-item:hover {
        background: #ffeef2;
        border-color: #f78ca8;
        transform: scale(1.02);
        box-shadow: 0 8px 18px #f8a0b8a0;
      }

      .link-item:active {
        transform: scale(0.97);
      }

      /* Warna icon khusus */
      .link-item .fa-shopee {
        color: #ee4d2d;
      }
      .link-item .fa-tiktok {
        color: #010101;
      }
      .link-item .fa-instagram {
        color: #d62976;
      }
      .link-item .fa-whatsapp {
        color: #25d366;
      }
      .link-item .fa-shopping-bag {
        color: #ff6b6b;
      }
      .link-item .fa-store {
        color: #ff6b6b;
      }

      /* Tombol khusus */
      .wa-link {
        background: rgba(220, 245, 220, 0.5);
        border-color: #b8d9b0;
      }
      .wa-link i {
        color: #25d366;
      }
      .wa-link:hover {
        background: #e6f5e0;
        border-color: #7cb87a;
      }

      .shop-link {
        background: rgba(255, 235, 220, 0.5);
        border-color: #fad1c0;
      }
      .shop-link i {
        color: #ff6b35;
      }
      .shop-link:hover {
        background: #fff0e6;
        border-color: #f5a080;
      }

      .tiktokshop-link {
        background: rgba(220, 235, 245, 0.5);
        border-color: #c0d4e6;
      }
      .tiktokshop-link i {
        color: #010101;
      }
      .tiktokshop-link:hover {
        background: #e6eff5;
        border-color: #8ab3d6;
      }

      .footer-note {
        margin-top: 24px;
        font-size: 15px;
        font-weight: 600;
        color: #a06578;
        letter-spacing: 0.3px;
        background: rgba(255, 235, 240, 0.5);
        padding: 10px 14px;
        border-radius: 100px;
        backdrop-filter: blur(4px);
        border: 1px solid #ffd4de;
        display: inline-block;
      }

      .footer-note i {
        margin: 0 6px;
        color: #d45a7a;
      }

      .copy-tip {
        font-size: 14px;
        color: #9f6279;
        margin-top: 12px;
        opacity: 0.8;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        background: rgba(255, 220, 230, 0.3);
        padding: 8px 18px;
        border-radius: 40px;
        width: fit-content;
        margin-left: auto;
        margin-right: auto;
        cursor: pointer;
        transition: 0.2s;
      }

      .copy-tip:hover {
        background: rgba(255, 200, 215, 0.5);
      }

      .copy-tip i {
        font-size: 16px;
        color: #b95578;
      }

      @media (max-width: 450px) {
        .card {
          padding: 24px 18px 28px;
        }
        .title {
          font-size: 24px;
        }
        .link-item {
          font-size: 16px;
          padding: 12px 18px;
        }
        .link-item i {
          font-size: 22px;
          width: 30px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- ==========================================
           BAGIAN INI YANG DIUBAH (UNTUK GAMBAR)
           Ganti "foto-anda.jpg" dengan file/URL gambar Anda
           ========================================== -->
      <div class="avatar">
        <img src="logo ld.jpeg" alt="Foto Profil" />
      </div>
      <!-- ========================================== -->

      <h1 class="title">🎀୨୧L'atelier d'Amanda♡</h1>
      <div class="subtitle">
        <i class="fas fa-heart" style="color: #d45a7a; margin-right: 6px"></i>
        aksesoris & perhiasan
      </div>

      <div class="link-list">
        <!-- Shopee (dengan logo keranjang) -->
        <a href="#" class="link-item shop-link" target="_blank" rel="noopener">
          <i class="fas fa-shopping-bag"></i>
          <span>Shopee</span>
          <i
            class="fas fa-chevron-right"
            style="font-size: 14px; opacity: 0.6; width: auto"
          ></i>
        </a>

        <!-- TikTok Shop (dengan logo keranjang) -->
        <a
          href="https://www.tiktok.com/@latelier.damanda6?_r=1&_t=ZS-999A3Ba8tim"
          class="link-item tiktokshop-link"
          target="_blank"
          rel="noopener"
        >
          <i class="fas fa-store"></i>
          <span>TikTok Shop</span>
          <i
            class="fas fa-chevron-right"
            style="font-size: 14px; opacity: 0.6; width: auto"
          ></i>
        </a>

        <!-- Instagram -->
        <a
          href="https://www.instagram.com/latelier.damanda?igsi=MWx2c21xdjhwNDdqZg=="
          class="link-item"
          target="_blank"
          rel="noopener"
        >
          <i class="fab fa-instagram"></i>
          <span>Instagram</span>
          <i
            class="fas fa-chevron-right"
            style="font-size: 14px; opacity: 0.6; width: auto"
          ></i>
        </a>

        <!-- WhatsApp -->
        <a
          href="https://wa.me/628123456789"
          class="link-item wa-link"
          target="_blank"
          rel="noopener"
        >
          <i class="fab fa-whatsapp"></i>
          <span>+62 812 3456 789</span>
          <i
            class="fas fa-chevron-right"
            style="font-size: 14px; opacity: 0.6; width: auto"
          ></i>
        </a>
      </div>

      <!-- tombol salin nomor -->
      <div class="copy-tip" onclick="copyPhone()">
        <i class="fas fa-copy"></i> salin nomor HP
      </div>

      <div class="footer-note">
        <i class="fas fa-rings-wedding"></i>
        temani gaya mu
        <i class="fas fa-heart" style="color: #d45a7a"></i>
      </div>
    </div>

    <script>
      // Fungsi copy nomor HP
      function copyPhone() {
        const phoneNumber = "+628123456789";
        navigator.clipboard
          .writeText(phoneNumber)
          .then(() => {
            const tip = document.querySelector(".copy-tip");
            const originalHTML = tip.innerHTML;
            tip.innerHTML =
              '<i class="fas fa-check-circle"></i> nomor tersalin!';
            tip.style.background = "#d4edda";
            tip.style.color = "#155724";
            setTimeout(() => {
              tip.innerHTML = originalHTML;
              tip.style.background = "rgba(255, 220, 230, 0.3)";
              tip.style.color = "#9f6279";
            }, 1800);
          })
          .catch(() => {
            alert("Silakan salin nomor secara manual: +628123456789");
          });
      }

      // Demo untuk link yang masih placeholder
      document.querySelectorAll(".link-item:not(.wa-link)").forEach((item) => {
        if (item.getAttribute("href") === "#") {
          item.addEventListener("click", (e) => {
            e.preventDefault();
            const platform = item.querySelector("span")?.innerText || "link";
            alert(`🔗 Menuju ${platform} (ganti href dengan link asli)`);
          });
        }
      });
    </script>
  </body>
</html>
